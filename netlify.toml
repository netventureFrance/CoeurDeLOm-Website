[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

# Next.js plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sync blog images from Airtable before build
[[plugins]]
  package = "./netlify/plugins/sync-blog-images"

# i18n redirects
[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  force = false
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/de"
  status = 302
  force = false
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  force = false
  conditions = {Language = ["en"]}

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
